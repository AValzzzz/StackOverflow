<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>STACK OVERFLOW</title>
    <meta name="description" content="STACK OVERFLOW - a card-based roguelike, playable in the browser.">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #111;
        height: 100%;
        overflow: hidden;
      }

      #container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas.emscripten {
        border: 0px none;
        background: black;
        max-width: 100%;
        max-height: 100%;
        outline: none;
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        font-family: monospace;
        color: #ddd;
        pointer-events: none;
      }

      #overlay button {
        pointer-events: auto;
        background: rgba(30, 30, 30, 0.7);
        border: 1px solid #666;
        color: #ddd;
        cursor: pointer;
        padding: 4px 10px;
        font-family: monospace;
        font-size: 12px;
      }

      #overlay button:hover {
        background: rgba(60, 60, 60, 0.9);
      }

      #status {
        font-size: 13px;
      }

      #controls {
        display: flex;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

      <div id="overlay">
        <div id="status">Loading...</div>
        <div id="controls">
          <button id="btn-audio" onclick="toggleAudio()">🔈 Enable audio</button>
          <button id="btn-fullscreen" onclick="Module.requestFullscreen(false, true)">⛶ Fullscreen</button>
        </div>
      </div>
    </div>

    <script type="text/javascript">
      var statusElement = document.querySelector('#status');

      var Module = {
        preRun: [],
        postRun: [],
        print: function () {},
        printErr: function (text) {
          console.error(Array.prototype.slice.call(arguments).join(' '));
        },
        canvas: document.querySelector('#canvas'),
        setStatus: function (text) {
          statusElement.innerHTML = text;
          if (!text) statusElement.style.display = 'none';
        },
        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left
            ? 'Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
            : 'All downloads complete.');
        },
      };

      window.onerror = function () {
        Module.setStatus('Error - see console for details');
      };

      var audioBtn = document.querySelector('#btn-audio');
      var audioContexts = [];
      (function () {
        if (typeof self.AudioContext === 'undefined') return;
        self.AudioContext = new Proxy(self.AudioContext, {
          construct(target, args) {
            var ctx = new target(...args);
            audioContexts.push(ctx);
            if (ctx.state === 'suspended') audioBtn.style.display = 'inline-block';
            else audioBtn.style.display = 'none';
            return ctx;
          }
        });
      })();

      function toggleAudio() {
        audioContexts.forEach(function (ctx) {
          if (ctx.state === 'suspended') ctx.resume();
        });
        audioBtn.style.display = 'none';
      }
      audioBtn.style.display = 'none';
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
